name = "smartmonke-publisher"
main = "src/index.js"
compatibility_date = "2024-09-01"

# Environment variables (public)
[vars]
GITHUB_OWNER = "StackTactician"
GITHUB_REPO = "smart-monke"
GITHUB_BRANCH = "main"
ALLOWED_ORIGIN = "*"

# Secrets to be configured via Wrangler CLI or Cloudflare Dashboard:
# - GITHUB_TOKEN: GitHub Personal Access Token (fine-grained with Contents read/write)
# - PUBLISH_SECRET: Your private authoring passphrase
